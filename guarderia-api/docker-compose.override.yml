services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  storage:
    # el teléfono sube y descarga directo de aquí (el emulador lo ve como 10.0.2.2:9000).
    ports:
      - "127.0.0.1:9000:9000"
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/code/app
      - ./migrations:/code/migrations
    ports:
      - "127.0.0.1:8000:8000"
