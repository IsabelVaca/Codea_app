services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  # fotos y documentos: un servidor compatible con S3 (SeaweedFS) para desarrollo.
  storage:
    image: chrislusf/seaweedfs:3.80
    entrypoint: ["/bin/sh", "/seaweedfs-s3.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./docker/seaweedfs-s3.sh:/seaweedfs-s3.sh:ro
      - media:/data

  api:
    build: .
    env_file: .env
    environment:
      # si DATABASE_URL tiene valor en .env se usa esa (Aiven); si no, el Postgres local de arriba.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      S3_ENDPOINT_URL: http://storage:9000
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

volumes:
  pgdata:
  media:
